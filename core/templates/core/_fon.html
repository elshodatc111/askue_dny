<svg class="fon-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="fg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor" stop-opacity=".16"/></linearGradient>
    <radialGradient id="fg-glow"><stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <g id="pylon" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
      <path d="M-30 0L-8 -150M30 0L8 -150M-8 -150L8 -150"/>
      <path d="M-26 -30L26 -30M-21 -66L21 -66M-14 -104L14 -104"/>
      <path d="M-30 0L21 -66M30 0L-21 -66M-26 -30L14 -104M26 -30L-14 -104"/>
      <path d="M-70 -150L70 -150M-52 -178L52 -178M0 -150L0 -205"/>
      <path d="M-70 -150L-52 -178M70 -150L52 -178"/>
    </g>
    <g id="turbine">
      <path d="M-3 0L-1.5 -90L1.5 -90L3 0Z" fill="currentColor"/>
      <g transform="translate(0 -90)">
        <g class="rot"><path d="M0 0L-4 -6L0 -62L4 -6Z M0 0L-6 1L-52 31L-47 36Z M0 0L6 1L52 31L47 36Z" fill="currentColor"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></g>
        <circle r="5" fill="currentColor"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#fg-sky)"/>
  <circle cx="1330" cy="250" r="170" fill="url(#fg-glow)" class="sun"/>

  <!-- uzoq tepaliklar va shamol generatorlari -->
  <path d="M0 640C180 590 300 640 470 610C650 575 780 650 960 620C1150 590 1330 650 1600 600V900H0Z" fill="currentColor" opacity=".08"/>
  <g color="currentColor" opacity=".35">
    <use href="#turbine" transform="translate(1180 640) scale(.7)"/>
    <use href="#turbine" transform="translate(1290 650) scale(.55)"/>
    <use href="#turbine" transform="translate(1390 640) scale(.8)"/>
    <use href="#turbine" transform="translate(120 650) scale(.6)"/>
  </g>

  <!-- yaqin tepalik -->
  <path d="M0 740C220 700 420 760 650 730C900 695 1150 760 1380 725C1480 710 1550 720 1600 735V900H0Z" fill="currentColor" opacity=".12"/>

  <!-- uzatish liniyalari -->
  <g fill="none" stroke="currentColor" stroke-width="2" opacity=".55">
    <path d="M150 600Q380 660 610 600T1070 600T1530 600"/>
    <path d="M150 625Q380 685 610 625T1070 625T1530 625" opacity=".7"/>
    <path d="M150 572Q380 632 610 572T1070 572T1530 572" opacity=".7"/>
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 46" class="flow">
    <path d="M150 600Q380 660 610 600T1070 600T1530 600"/>
    <path d="M150 625Q380 685 610 625T1070 625T1530 625" class="flow2"/>
    <path d="M150 572Q380 632 610 572T1070 572T1530 572" class="flow3"/>
  </g>

  <!-- tayanch ustunlar -->
  <g color="currentColor" opacity=".5">
    <use href="#pylon" transform="translate(150 780)"/>
    <use href="#pylon" transform="translate(610 780)"/>
    <use href="#pylon" transform="translate(1070 780)"/>
    <use href="#pylon" transform="translate(1530 780)"/>
  </g>

  <!-- ko'chib yuruvchi energiya impulslari -->
  <g fill="#fbbf24">
    <circle r="5"><animateMotion dur="7s" repeatCount="indefinite" path="M150 600Q380 660 610 600T1070 600T1530 600"/></circle>
    <circle r="4"><animateMotion dur="9s" begin="2s" repeatCount="indefinite" path="M1530 625Q1300 685 1070 625T610 625T150 625"/></circle>
    <circle r="4"><animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M150 572Q380 632 610 572T1070 572T1530 572"/></circle>
  </g>

  <!-- transformator podstansiyasi -->
  <g color="currentColor" opacity=".4" transform="translate(300 790)" fill="none" stroke="currentColor" stroke-width="3">
    <rect x="-40" y="-40" width="80" height="40" rx="4"/><path d="M-25 -40V-70M0 -40V-80M25 -40V-70"/><path d="M-32 -70H-18M-7 -80H7M18 -70H32"/>
    <path d="M-60 0H60" opacity=".7"/>
  </g>

  <!-- uchqunlar -->
  <g fill="#fbbf24" class="sparks">
    <circle cx="260" cy="820" r="2.5"/><circle cx="520" cy="860" r="2"/><circle cx="780" cy="830" r="3"/>
    <circle cx="1000" cy="860" r="2"/><circle cx="1250" cy="820" r="2.5"/><circle cx="1460" cy="850" r="2"/>
  </g>
</svg>
